<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EWS Margorejo — Login</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚨</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2E7D32 0%, #1B5E20 50%, #0D3B0F 100%);
      padding: 20px;
    }
    .login-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: fadeIn 0.6s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .login-logo {
      font-size: 48px;
      text-align: center;
      margin-bottom: 8px;
    }
    .login-title {
      color: #1B5E20;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 4px;
    }
    .login-subtitle {
      color: #757575;
      font-size: 13px;
      text-align: center;
      margin-bottom: 32px;
      line-height: 1.4;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #333;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s;
      outline: none;
    }
    .form-group input:focus {
      border-color: #2E7D32;
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: #1B5E20;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .btn-login:hover {
      background: #2E7D32;
    }
    .btn-login:active {
      background: #0D3B0F;
    }
    .error-msg {
      display: none;
      color: #D32F2F;
      font-size: 13px;
      text-align: center;
      margin-top: 16px;
      padding: 10px;
      background: #FFEBEE;
      border-radius: 6px;
    }
    .error-msg.show {
      display: block;
      animation: shake 0.4s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    .footer-text {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: #9e9e9e;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">🚨</div>
    <h1 class="login-title">EWS Margorejo</h1>
    <p class="login-subtitle">
      Sistem Peringatan Dini Tanah Longsor<br>
      Sampok, Sriharjo, Imogiri, Bantul, DIY
    </p>
    
    <form id="loginForm" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Masukkan username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Masukkan password" required>
      </div>
      <button type="submit" class="btn-login">Masuk</button>
    </form>
    
    <div class="error-msg" id="errorMsg">
      ❌ Username atau password salah!
    </div>
    
    <div class="footer-text">
      © 2026 PKM Margorejo — Universitas
    </div>
  </div>

  <script>
    // Cek jika sudah login, langsung ke dashboard
    if (localStorage.getItem('ews_auth')) {
      window.location.href = 'dashboard.html';
    }

    function handleLogin(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      
      // Kredensial default (bisa diubah)
      const VALID_USER = 'admin';
      const VALID_PASS = 'ews2026';
      
      if (username === VALID_USER && password === VALID_PASS) {
        // Simpan token autentikasi
        localStorage.setItem('ews_auth', btoa(username + ':' + Date.now()));
        window.location.href = 'dashboard.html';
      } else {
        const errorMsg = document.getElementById('errorMsg');
        errorMsg.classList.remove('show');
        // Trigger reflow agar animasi bisa diulang
        void errorMsg.offsetWidth;
        errorMsg.classList.add('show');
      }
      
      return false;
    }
  </script>
</body>
</html>
